name: Paper artifact

on:
  push:
    branches: [master]
    paths:
      - "docs/artifact/**"
      - "docs/paper/**"
      - "scripts/build_paper_arxiv.sh"
      - "scripts/check_paper_artifact.sh"
      - "scripts/test_nccl_bench.sh"
      - "scripts/nccl_bench.sh"
      - "Makefile"
      - "README.md"
      - ".github/workflows/publish.yml"
      - ".github/workflows/paper-artifact.yml"
  pull_request:
    paths:
      - "docs/artifact/**"
      - "docs/paper/**"
      - "scripts/build_paper_arxiv.sh"
      - "scripts/check_paper_artifact.sh"
      - "scripts/test_nccl_bench.sh"
      - "scripts/nccl_bench.sh"
      - "Makefile"
      - "README.md"
      - ".github/workflows/publish.yml"
      - ".github/workflows/paper-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install paper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make unzip zip cm-super texlive-latex-base texlive-latex-extra \
            texlive-publishers texlive-bibtex-extra texlive-fonts-recommended
      - name: Build and check paper artifacts
        env:
          SOURCE_DATE_EPOCH: "0"
        run: make artifact-check
      - name: Check benchmark driver
        run: scripts/test_nccl_bench.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ncclbpf-paper-artifact
          if-no-files-found: error
          path: |
            docs/paper/paper.pdf
            docs/paper/paper-source.zip
            docs/paper/arxiv-submission.tar.gz
            docs/artifact/README.md
            docs/artifact/SHA256SUMS
